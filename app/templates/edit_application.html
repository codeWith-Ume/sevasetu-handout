{% extends "base.html" %}
{% block content %}

<h2>Edit Application</h2>
<p>Correct your details and save the changes.</p>

<form method="post">

  <label>Full Name*</label>
  <input type="text" name="applicant_name" maxlength="100"
         value="{{ data.get('applicant_name', '') }}" required>

  <label>Date of Birth (DD/MM/YYYY)*</label>
  <input type="text" name="dob" placeholder="DD/MM/YYYY"
         value="{{ data.get('dob', '') }}" required>

  <label>Gender*</label>
  <select name="gender" required>
    <option value="">--Select--</option>
    {% for option in ['Male', 'Female', 'Other'] %}
    <option value="{{ option }}"
      {% if data.get('gender') == option %}selected{% endif %}>
      {{ option }}
    </option>
    {% endfor %}
  </select>

  <label>Marital Status*</label>
  <select name="marital_status" required>
    <option value="">--Select--</option>
    {% for option in ['Married', 'Unmarried', 'Widowed'] %}
    <option value="{{ option }}"
      {% if data.get('marital_status') == option %}selected{% endif %}>
      {{ option }}
    </option>
    {% endfor %}
  </select>

  <label>Spouse's Name (if applicable)</label>
  <input type="text" name="spouse_name"
         value="{{ data.get('spouse_name', '') }}">

  <label>Spouse's Occupation/Employer (if applicable)</label>
  <input type="text" name="spouse_employer"
         value="{{ data.get('spouse_employer', '') }}">

  <h3>Address Details</h3>

  <label>House Number / Street / Mohalla*</label>
  <input type="text" name="full_address"
         value="{{ data.get('full_address', '') }}" required>

  <label>Village / Town*</label>
  <input type="text" name="village" maxlength="100"
         value="{{ data.get('village', '') }}" required>

  <label>Post Office*</label>
  <input type="text" name="post_office"
         value="{{ data.get('post_office', '') }}" required>

  <label>Block / Tehsil*</label>
  <input type="text" name="block" maxlength="50"
         value="{{ data.get('block', '') }}" required>

  <label>District*</label>
  <input type="text" name="district"
         value="{{ data.get('district', '') }}" required>

  <label>State*</label>
  <input type="text" name="state"
         value="{{ data.get('state', 'Uttar Pradesh') }}" required>

  <label>PIN Code*</label>
  <input type="text" name="pin_code"
         value="{{ data.get('pin_code', '') }}"
         pattern="[0-9]{6}" maxlength="6" required>

  <h3>Bank Details</h3>

  <label>Bank Account Number*</label>
  <input type="text" name="bank_account" maxlength="30"
         value="{{ data.get('bank_account', '') }}" required>

  <label>IFSC Code*</label>
  <input type="text" name="ifsc" maxlength="15"
         value="{{ data.get('ifsc', '') }}" required>

  <p>
    <button class="btn" type="submit">Save Changes</button>
  </p>

</form>

<p>
  <a href="{{ url_for('view_application', app_id=app_id) }}">Cancel</a>
</p>

{% endblock %}
