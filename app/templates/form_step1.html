{% extends "base.html" %}
{% block content %}

<div class="steps">
  <b>Step 2 of 6:</b> Personal Details
</div>

<h2>Personal Details</h2>

<form method="post">
  <label>Full Name of Applicant (as per age proof document)*</label>
  <input
    type="text"
    name="applicant_name"
    value="{{ data.get('applicant_name','') }}"
    required
  >

  <label>Date of Birth (DD/MM/YYYY)*</label>
  <input
    type="text"
    name="dob"
    placeholder="DD/MM/YYYY"
    value="{{ data.get('dob','') }}"
    required
  >

  <label>Gender*</label>
  <select name="gender" required>
    <option value="">--Select--</option>
    <option value="Male" {% if data.get('gender')=='Male' %}selected{% endif %}>Male</option>
    <option value="Female" {% if data.get('gender')=='Female' %}selected{% endif %}>Female</option>
    <option value="Other" {% if data.get('gender')=='Other' %}selected{% endif %}>Other</option>
  </select>

  <label>Marital Status*</label>
  <select name="marital_status" required>
    <option value="">--Select--</option>
    <option value="Married" {% if data.get('marital_status')=='Married' %}selected{% endif %}>Married</option>
    <option value="Unmarried" {% if data.get('marital_status')=='Unmarried' %}selected{% endif %}>Unmarried</option>
    <option value="Widowed" {% if data.get('marital_status')=='Widowed' %}selected{% endif %}>Widowed</option>
  </select>

  <label>Spouse's Name / Father's Name / Guardian Name*</label>
  <input
    type="text"
    name="guardian_name"
    value="{{ data.get('guardian_name','') }}"
    required
  >

  <p class="note">Fields marked * are required.</p>

  <p>
    <button class="btn" type="submit">Save &amp; Continue</button>
  </p>
</form>

{% endblock %}
