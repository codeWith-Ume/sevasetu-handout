{% extends "base.html" %}
{% block content %}

<div class="steps">
  <b>Step 1 of 6:</b>
  Mobile Verification &rsaquo; Personal Details &rsaquo; Address &rsaquo;
  Bank Details &rsaquo; Document Upload &rsaquo; Declaration
</div>

<h2>Mobile Verification</h2>

<form method="post">
  <label>Mobile Number</label>
  <input
    type="text"
    name="mobile"
    maxlength="10"
    placeholder="10 digit mobile number"
  >

  <label>Security Check</label>

  <div style="margin-bottom: 12px;">
    <img
      id="captcha-image"
      src="{{ url_for('captcha_image') }}"
      alt="CAPTCHA security code"
      width="220"
      height="80"
      style="display: block; margin-bottom: 10px;"
    >

    <button
      type="button"
      id="reload-captcha"
      class="btn"
      style="margin-bottom: 10px;"
    >
      Reload CAPTCHA
    </button>

    <input
      type="text"
      name="captcha"
      maxlength="6"
      required
      autocomplete="off"
      placeholder="Enter the code shown"
      style="max-width: 220px; display: block;"
    >
  </div>

  <p>
    <button class="btn" type="submit">Send OTP</button>
  </p>
</form>

<p class="note">
  An OTP will be sent to your mobile number by SMS. OTP is valid for 5 minutes.
</p>

<script>
document.getElementById("reload-captcha").addEventListener("click", async function () {
  const button = this;
  button.disabled = true;

  try {
    const response = await fetch("{{ url_for('reload_captcha') }}");

    if (!response.ok) {
      throw new Error("Reload request failed");
    }

    const result = await response.json();

    if (result.success) {
      document.getElementById("captcha-image").src =
        "{{ url_for('captcha_image') }}?t=" + Date.now();

      document.querySelector('input[name="captcha"]').value = "";
    } else {
      throw new Error("CAPTCHA reload unsuccessful");
    }
  } catch (error) {
    console.error("CAPTCHA reload error:", error);
    alert("CAPTCHA reload nahi hua. Please try again.");
  } finally {
    button.disabled = false;
  }
});
</script>

{% endblock %}
