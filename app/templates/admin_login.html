{% extends "base.html" %}
{% block content %}

<h2>Departmental Login</h2>

<form method="post">
  <label>Username</label>
  <input
    type="text"
    name="username"
    autocomplete="username"
    required
  >

  <label>Password</label>
  <input
    type="password"
    name="password"
    autocomplete="current-password"
    required
  >

  <p>
    <button class="btn" type="submit">Login</button>
  </p>
</form>

{% endblock %}
