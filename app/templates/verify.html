{% extends "base.html" %}
{% block content %}
<div class="steps"><b>Step 1 of 6:</b> Mobile Verification</div>
<h2>Enter OTP</h2>
<p class="note">An OTP has been sent to {{ mobile }}.</p>
<form method="post">
  <label>OTP</label>
  <input type="text" name="otp" maxlength="6" style="max-width:160px" required>
  <p><button class="btn" type="submit">Verify</button></p>
  <span>NOTE: To view your OTP, visit the <a href="https://sevasetu-smsgw.onrender.com/" target="_blank">SMS Gateway Console</a>.</span>
  
</form>
{% endblock %}
