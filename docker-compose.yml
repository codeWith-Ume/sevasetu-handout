services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - smsgw
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu
    
    

  scheduler:
    build: ./app
    command: ["cron", "-f"]
    depends_on:
      - db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: Asia/Kolkata
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    # internal only — reached by the app over the docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"
    
    #Adding here for sms gateway service
    env_file:
      - .env

volumes:
  pgdata:
  uploads:
  applogs:
